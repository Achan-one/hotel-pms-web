name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Lint, Type-check & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # oxlint: 오류가 있으면 실패하고, 경고만 있으면 통과한다.
      - name: Lint
        run: npm run lint

      # tsc -b 로 타입 검사를 하고 vite build 로 번들이 만들어지는지까지 확인한다.
      - name: Type-check & Build
        run: npm run build
        env:
          VITE_API_BASE_URL: http://localhost:8080
